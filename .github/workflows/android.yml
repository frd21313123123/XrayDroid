name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2

      - name: Тесты ядра
        run: cargo test -p xd-core

      - name: Сборка APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          GRADLE: ./gradlew
        run: ./build-android.sh

      - name: Переименование
        run: |
          V=$(grep versionName android/app/build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          cp android/app/build/outputs/apk/release/app-release.apk XrayDroid-$V.apk
          echo "APK=XrayDroid-$V.apk" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: XrayDroid-apk
          path: ${{ env.APK }}

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
