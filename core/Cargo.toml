[package]
name = "xd-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ipstack = "1"
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher", "aead-cipher-2022"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
aes = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sha3 = "0.10"
crc32fast = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
regex = "1"
log = "0.4"
anyhow = "1"
bytes = "1"
h2 = "0.4"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
blake2 = "0.10"
ml-kem = "0.2"
blake3 = "1"
ctr = "0.9"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
libc = "0.2"
parking_lot = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
rcgen = "0.13"
