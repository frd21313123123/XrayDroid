[package]
name = "xd-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xraydroid"
crate-type = ["cdylib", "rlib"]

[dependencies]
xd-core = { path = "../core" }
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-systemfonts", "image-default-formats"] }
png = "0.17"
# для встроенных SVG-иконок стиля material в инструменте скриншотов
i-slint-core = { version = "=1.18.1", features = ["svg", "image-decoders"] }

[build-dependencies]
slint-build = "1.18"
